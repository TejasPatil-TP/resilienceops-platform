global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'demo-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['demo-service:8080']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
